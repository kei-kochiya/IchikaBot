version: 2
updates:
  # Maintain dependencies for Python pip
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      dependencies:
        patterns:
          - "*"
    reviewers:
      - "kei-kochiya"

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns:
          - "*"
